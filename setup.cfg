[flake8]
max-line-length = 79
extend-exclude =
    .venv,
    build,
    dist,
    __pycache__
# W503 (line break before binary operator) conflicts with PEP 8's own
# recommendation; disable it so mypy-friendly formatting is allowed.
extend-ignore = W503

[mypy]
python_version = 3.10
ignore_missing_imports = True
